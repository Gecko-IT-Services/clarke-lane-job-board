<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Clarke Lane Job Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Tabbed work app: jobs table for the office, big tap targets for the shop floor, quotes and dispatch as short panels. Design from the agreed mockup. */
:root{
  --bg:#ECECEE; --surface:#FFFFFF; --field:#F4F4F5; --line:#D5D5D9; --ink:#111214; --muted:#64646A;
  --chrome:#111214; --chrome-ink:#FFFFFF; --chrome-mute:#A9A9AE; --steel:#3A3A3F; --steel-soft:#E4E4E7;
  --ok:#25744A; --ok-soft:#E0F1E7; --warn:#B45309; --warn-soft:#FDEED9; --bad:#B4321F; --bad-soft:#FBE4E0; --info:#2B5BD7; --info-soft:#E6EEFF;
  --paper:#FFFFFF; --paper-ink:#111214; --paper-line:#C9C9CE; --paper-mute:#5A5A60;
  --xero-ink:#000856; --display:-apple-system,system-ui,'Segoe UI',Helvetica,Arial,sans-serif; --body:'Archivo',-apple-system,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0C0D; --surface:#17171A; --field:#202024; --line:#323238; --ink:#EDEDEF; --muted:#9C9CA3;
  --chrome:#000000; --steel:#B4B4BA; --steel-soft:#2A2A2F;
  --ok:#5CC48A; --ok-soft:#173526; --warn:#F0A54B; --warn-soft:#3A2812; --bad:#F07B66; --bad-soft:#3D1C17; --info:#8FADFF; --info-soft:#1A2440; --xero-ink:#3ECCFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0C0D; --surface:#17171A; --field:#202024; --line:#323238; --ink:#EDEDEF; --muted:#9C9CA3;
  --chrome:#000000; --steel:#B4B4BA; --steel-soft:#2A2A2F;
  --ok:#5CC48A; --ok-soft:#173526; --warn:#F0A54B; --warn-soft:#3A2812; --bad:#F07B66; --bad-soft:#3D1C17; --info:#8FADFF; --info-soft:#1A2440; --xero-ink:#3ECCFF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.025em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* one sticky bar: logo, tabs, who. Below 1100px the tabs drop to their own row. */
:root{--hdr:58px}
.top{background:var(--chrome);color:var(--chrome-ink);padding-inline:16px;padding-top:env(safe-area-inset-top,0px);position:sticky;top:0;z-index:20}
.top .in{max-width:1640px;margin:0 auto;display:flex;align-items:center;gap:0 12px;min-height:var(--hdr)}
.top .logo{height:32px;width:auto;display:block;flex:0 0 auto}
.gsearch{position:relative;margin-left:auto;flex:none;width:36px;height:34px}   /* a magnifier that opens over the tabs; a full box on wide screens */
.gsearch .gicon{position:absolute;right:10px;top:9px;width:16px;height:16px;color:#C8C8CC;pointer-events:none;z-index:2}
.top .gsearch input{position:absolute;right:0;top:0;height:34px;width:36px;background:#1E1E22;color:#fff;border:1px solid #3A3A3F;border-radius:8px;padding:6px 10px 6px 32px;font:inherit;font-size:13px;cursor:pointer;transition:width .15s}
.top .gsearch input::placeholder{color:transparent} .top .gsearch input::-webkit-search-cancel-button{display:none}
.top .gsearch input:focus,.top .gsearch input:not(:placeholder-shown){width:min(380px,calc(100vw - 32px));padding-left:12px;padding-right:34px;cursor:text;outline:2px solid #5B8DEF;outline-offset:0;border-color:transparent;z-index:1}
.top .gsearch input:focus::placeholder{color:#8C8C91} .top .gsearch input:focus ~ .gicon,.gsearch:focus-within .gicon{color:#fff}
@media (min-width:1500px){.gsearch{width:240px} .top .gsearch input,.top .gsearch input:focus,.top .gsearch input:not(:placeholder-shown){width:240px;padding:6px 34px 6px 12px;cursor:text} .top .gsearch input::placeholder{color:#8C8C91}}
.gres{position:absolute;right:0;top:calc(100% + 6px);width:min(460px,92vw);max-height:70vh;overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.25);padding:6px;z-index:40}
.gres .gg h4{margin:8px 8px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)} .gres .gg h4 span{text-transform:none;letter-spacing:0;font-weight:400}
.gres .gi{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;font:inherit;color:inherit;cursor:pointer}
.gres .gi b{font-size:14px} .gres .gi small{color:var(--muted);font-size:12px} .gres .gi.on,.gres .gi:hover{background:var(--field)} .gres .gnone{margin:10px;color:var(--muted)}
#v-customers .cglance{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-content:start}
@media (max-width:700px){.gsearch:focus-within .gicon{display:none} .top .gsearch input:focus,.top .gsearch input:not(:placeholder-shown){position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 10px);width:auto} .gres{position:fixed;left:8px;right:8px;width:auto;top:calc(env(safe-area-inset-top,0px) + 52px)}}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--chrome-mute);flex:none}
.who select{background:#1E1E22;color:#fff;border:1px solid #3A3A3F;border-radius:8px;padding:6px 10px;font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;align-self:stretch;min-width:0}
nav.tabs a{font-family:var(--body);font-size:14.5px;font-weight:500;color:var(--chrome-mute);text-decoration:none;padding:3px 7px 0;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs a:hover{color:#E4E4E7;border-bottom-color:#3A3A3F}
nav.tabs a[aria-current="page"]{color:#fff;border-color:#fff;font-weight:600}
@media (max-width:1100px){
  :root{--hdr:96px}
  .top .in{flex-wrap:wrap;min-height:0}
  .top .logo{margin-block:12px}
  nav.tabs{order:3;flex-basis:calc(100% + 32px);margin-inline:-16px;padding-inline:4px;border-top:1px solid #222226}
  nav.tabs a{padding:10px 12px 7px}
}
nav.tabs .badge{font-family:var(--body);font-size:12px;background:#2A2A2F;color:#fff;border-radius:999px;padding:1px 8px}
nav.tabs .badge.go{background:#25744A;margin-right:4px}

.backrow{margin-bottom:-8px} .kiosk-mode .backrow{display:none}
.wrap{max-width:1640px;margin:0 auto;padding-inline:16px;padding-block:18px 64px;display:flex;flex-direction:column;gap:18px}
.banner{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:10px;padding:10px 14px;font-size:14px;display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap}
.banner p{flex:1 1 420px;min-width:0}
.view{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;align-items:baseline;gap:8px 14px;flex-wrap:wrap}
.sec-h h2{font-size:30px}
.sec-h .sub{color:var(--muted);font-size:14px}
.sec-h .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:13px;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.sm{padding:4px 10px;font-size:13.5px}
.btn.link{border:0;background:none;padding:0;text-decoration:underline;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none;margin-left:-2px}
.btn.sm svg{width:14px;height:14px}
.btn svg.xw,.btn.sm svg.xw{width:auto;height:.78em;margin:0 0 -.05em}
.btn.xero{background:#3ECCFF;border-color:#3ECCFF;color:#000856}
.btn.xero:hover{background:#6AD8FF;border-color:#6AD8FF}
nav.tabs a > svg{width:15px;height:15px;flex:none}
nav.tabs a > svg.xw{width:auto;height:12px}
.chip svg{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.sec-h .xhead{line-height:0;align-self:center;color:var(--xero-ink)}
.sec-h .xhead svg{height:28px;width:auto}
input[type=text],input[type=search],input[type=date],input[type=number],select.f{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}

.seg{display:inline-flex;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:7px;padding:7px 14px;font-weight:700;display:flex;gap:8px;align-items:center;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.seg .c{font-size:12px;background:var(--line);border-radius:999px;padding:0 7px;color:var(--ink)}

.chip{display:inline-block;border-radius:5px;padding:1px 7px;font-size:12px;font-weight:700;background:var(--field);color:var(--muted);white-space:nowrap}
.chip.late{background:var(--bad-soft);color:var(--bad)} .chip.soon{background:var(--warn-soft);color:var(--warn)} .chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.dark{background:var(--ink);color:var(--bg)}

/* jobs table */
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
table.jobs{width:100%;border-collapse:collapse;font-size:14px}
table.jobs th{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.jobs td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.jobs tr:last-child td{border-bottom:0}
table.jobs tbody tr{cursor:pointer}
table.jobs tbody tr:hover td{background:var(--field)}
td.cust b{display:block;font-weight:600;line-height:1.2}
td.cust .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
td.so{font-family:var(--mono);font-size:13px;white-space:nowrap}
td.val{text-align:right;font-weight:700;white-space:nowrap}
td.p{text-align:center}
table.jobs td.cust{min-width:150px}
.tick{width:28px;height:28px;border-radius:7px;border:2px solid var(--muted);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;padding:0}
.tick.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.tick svg{width:18px;height:18px}
.pt{display:inline-flex;align-items:center;gap:6px;min-height:34px;border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 8px;margin:2px 4px 2px 0;background:var(--surface);color:var(--muted);font:600 13px var(--body);cursor:pointer}
.pt .bx{width:16px;height:16px;border-radius:4px;border:2px solid currentColor;display:inline-grid;place-items:center}
.pt svg{width:12px;height:12px}
.pt.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.pt:hover{border-color:var(--muted)}
.pt:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
td.ord{white-space:nowrap;width:1%}
td.ord .n{display:inline-block;min-width:22px;font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right;margin-right:6px}
td.ord .n.placed{color:var(--ink);font-weight:700}
td.ord .mv{display:inline-flex;gap:2px}
td.ord .mv .btn{padding:3px 5px;min-width:24px;line-height:1;font-size:12px}
td.ord .grip{display:inline-block;cursor:grab;touch-action:none;user-select:none;color:var(--muted);font-size:16px;line-height:1;padding:4px 6px 4px 0;vertical-align:middle}
td.ord .grip:hover{color:var(--ink)}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none}
tr.dragging{opacity:.45}
tr.drop-before td{box-shadow:inset 0 3px 0 var(--ink)} tr.drop-after td{box-shadow:inset 0 -3px 0 var(--ink)}
.duepick{position:relative;display:inline-flex;align-items:center}
.duepick .duebtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;border-radius:6px}
.duepick .duebtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.duepick .pen{display:inline-flex;color:var(--muted);opacity:.55}
.duepick .pen svg{width:13px;height:13px}
.duepick .duebtn:hover .pen{opacity:1;color:var(--ink)}
.duepick input[type=date]{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.duepick + .note{display:block;font-size:12px;margin-top:2px}
:is(#v-home,#v-jobs) .month{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.month .mhead{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.month .mhead h3{font-size:17px} .month .mbig{font:600 24px var(--display);letter-spacing:-.02em} .month .mhead .g-state{margin-left:auto;align-self:center}
.month .minfo{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.month p{font-size:14.5px} .month p.note{font-size:13.5px} .month .ok{color:var(--ok)} .month p.bad{color:var(--bad);font-weight:600;font-size:14px}
.month a{font-weight:600;color:var(--info);text-decoration:none;font-size:14px}
.month .gwrap{margin:0}
#v-jobs .mline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:0;padding:10px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:14px} #v-jobs .mline .wip{color:var(--info)} #v-jobs .mline .gap{color:var(--warn)} #v-jobs .mline .ok{color:var(--ok)} #v-jobs .mline a{margin-left:auto;font-weight:600;color:var(--info);text-decoration:none} #v-jobs .mline .g-state{font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--warn-soft);color:var(--warn)} #v-jobs .mline .g-state.g-ok,#v-jobs .mline .g-state.g-top{background:var(--ok-soft);color:var(--ok)}
.month .g-state{font-size:13px;font-weight:600;border-radius:999px;padding:3px 12px;background:var(--warn-soft);color:var(--warn)}
.month .g-state.g-ok,.month .g-state.g-top{background:var(--ok-soft);color:var(--ok)}
/* The steel tube (Philip, 19 Oct), upright since 21 Oct (Levi: "vertical, fatter and smaller"): polished steel, filled from the bottom. */
.vtube{--steel-a:#FBFBFC;--steel-b:#D5D8DC;--steel-c:#A9AEB5;--steel-d:#C9CDD2;--steel-e:#ECEEF0;--steel-edge:#8A8F96;--cap:#6E737A;
  position:relative;display:grid;grid-template-columns:58px 104px;gap:8px;height:210px;padding:14px 0 12px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .vtube{--steel-a:#6A6E75;--steel-b:#45484E;--steel-c:#26282C;--steel-d:#3A3D42;--steel-e:#55585E;--steel-edge:#1A1B1E;--cap:#8C9097}}
:root[data-theme="dark"] .vtube{--steel-a:#6A6E75;--steel-b:#45484E;--steel-c:#26282C;--steel-d:#3A3D42;--steel-e:#55585E;--steel-edge:#1A1B1E;--cap:#8C9097}
.vt-body{position:relative;border-radius:29px;overflow:hidden;border:1px solid var(--steel-edge);
  background:linear-gradient(90deg,var(--steel-a) 0%,var(--steel-b) 28%,var(--steel-c) 55%,var(--steel-d) 78%,var(--steel-e) 100%);
  box-shadow:inset 3px 0 6px rgba(0,0,0,.28),inset -2px 0 3px rgba(255,255,255,.35)}
.vt-body::after{content:"";position:absolute;top:10px;bottom:10px;left:6px;width:12px;border-radius:999px;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.75),rgba(255,255,255,0))}
.vtube::before,.vtube::after{content:"";position:absolute;left:-6px;width:70px;height:12px;border-radius:5px;background:linear-gradient(180deg,var(--cap),var(--steel-a) 45%,var(--cap));box-shadow:0 1px 2px rgba(0,0,0,.3)}
.vtube::before{top:6px} .vtube::after{bottom:4px}
.vt-fill,.vt-could{position:absolute;left:0;right:0;bottom:0;border-radius:0 0 29px 29px}
.vt-fill{background:linear-gradient(90deg,var(--f1) 0%,var(--f2) 45%,var(--f3) 100%);box-shadow:inset -3px 0 4px rgba(0,0,0,.25),0 -2px 3px rgba(0,0,0,.18)}
.vt-fill.t-warn{--f1:#FFD9A0;--f2:#E39A2C;--f3:#A8620C}
.vt-fill.t-ok,.vt-fill.t-top{--f1:#A6EBC2;--f2:#33A564;--f3:#1D6A40}
.vt-could{background:repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 5px,rgba(255,255,255,0) 5px 10px),linear-gradient(90deg,#B9D3F2 0%,#5C8FCF 45%,#2F5E9E 100%);box-shadow:inset -3px 0 4px rgba(0,0,0,.22)}
.vt-ring{position:absolute;left:-1px;right:-1px;height:4px;margin-bottom:-2px;background:linear-gradient(180deg,#3A3D42,#C9CDD2,#3A3D42);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.vt-marks{position:relative;font-size:12px;color:var(--muted);white-space:nowrap}
.vt-marks span{position:absolute;left:0;transform:translateY(50%);line-height:1} .vt-marks b{color:var(--ink);font-weight:600}
.vt-marks .vt-pace{left:-8px;width:0;height:10px;padding:0;overflow:visible}
.vt-marks .vt-pace::before{content:"";position:absolute;left:0;top:50%;margin-top:-5px;border:5px solid transparent;border-right:7px solid var(--info);border-left:0}
.vtube.grow .vt-fill,.vtube.grow .vt-could{animation:vt-fill 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes vt-fill{from{height:0}}
@media (prefers-reduced-motion: reduce){.vtube.grow .vt-fill,.vtube.grow .vt-could{animation:none}}
.month .mbody{display:flex;gap:18px;align-items:stretch} .month .mside{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.month .mfigs{display:flex;flex-direction:column;gap:6px}
.month .mfig{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:0 8px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);border-left-width:4px}
.month .mfig span{font-size:12.5px;font-weight:600;color:var(--muted)} .month .mfig b{font:600 18px var(--display);letter-spacing:-.02em;grid-row:span 2} .month .mfig small{font-size:11.5px;color:var(--muted)}
.month .f-inv{border-left-color:#E39A2C} .month .f-inv.good{border-left-color:#33A564} .month .f-wip{border-left-color:#5C8FCF} .month .f-gap{border-left-color:var(--muted)} .month .f-gap.none{border-left-color:var(--ok)}
.month .minfo p{font-size:13px} .month .minfo p.note{font-size:12px}
.month .tform{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.month .tform label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.month .tform input{width:170px}
.thsort{all:unset;cursor:pointer;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit}
.thsort:hover,.thsort.on{color:var(--ink)} .thsort:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.empty{color:var(--muted);padding:24px 16px;text-align:center}

/* shop floor */
.pbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pbtn{min-height:64px;border-radius:12px;border:2px solid var(--line);background:var(--field);text-align:left;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.pbtn b{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.pbtn span{font-size:12px;color:var(--muted)}
.pbtn.done{background:var(--ok-soft);border-color:var(--ok)}
.pbtn.done b{color:var(--ok)}

/* shop floor kiosk: one shared touchscreen; everything big, nothing hover-only */
body.kiosk-mode #app > header.top,body.kiosk-mode #app > nav.tabs,body.kiosk-mode #preview-bar{display:none}
.kiosk{display:flex;flex-direction:column;gap:22px}
.kiosk .kbar{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap}
.kiosk .kbar h2{font-family:var(--display);font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.kiosk .kbar .sub{margin:2px 0 0;color:var(--muted);font-size:17px}

/* Workshop TV: the whiteboard on a big screen. Always the whiteboard's colours (white board, blue ticks, orange stars). */
body.tv-mode{background:#fff;overflow:hidden} body.tv-mode #app{max-width:none;padding:0;margin:0} body.tv-mode .toast,body.tv-mode .backrow{display:none}
.tv{--tv-ink:#14161A;--tv-line:#BFC4CC;--tv-mute:#5F6670;--tv-tick:#1F55D6;--tv-star:#E8641E;--tv-red:#C42B1C;--tv-green:#1E7A47;
  position:fixed;inset:0;z-index:50;height:100vh;display:flex;flex-direction:column;background:#fff;color:var(--tv-ink);padding:1.6vh 1.6vw;gap:1.2vh;box-sizing:border-box;font-family:var(--body)}
.tvbar{display:flex;align-items:center;gap:3vw}
.tvbrand{display:flex;flex-direction:column;line-height:1} .tvbrand b{font-size:3.4vh;letter-spacing:.02em} .tvbrand span{font-size:1.5vh;letter-spacing:.42em;color:var(--tv-mute);margin-top:.4vh}
.tvsum{display:flex;gap:2.4vw;font-size:2.4vh;color:var(--tv-mute)} .tvsum b{color:var(--tv-ink);font-size:3.2vh;margin-right:.4vw} .tvsum .late b{color:var(--tv-red)} .tvsum .ready b{color:var(--tv-green)}
.tvleave{position:fixed;bottom:1.2vh;right:1.6vw;z-index:55;font-size:2vh;padding:1vh 1.4vw;opacity:0;pointer-events:none;transition:opacity .3s;box-shadow:0 .6vh 2vh rgba(0,0,0,.18)}
body.tv-touch .tvleave{opacity:1;pointer-events:auto}
.tvclock{margin-left:auto;text-align:right;font-size:1.9vh;color:var(--tv-mute)} .tvclock b{display:block;font-size:4.2vh;color:var(--tv-ink);font-variant-numeric:tabular-nums;line-height:1.05}
.tvgrid{flex:1;width:100%;border-collapse:collapse;table-layout:fixed;border:.3vh solid #8E949C}
.tvgrid th,.tvgrid td{border:1px solid var(--tv-line);padding:0 .6vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tvgrid thead th{font-size:1.5vh;font-weight:700;text-transform:uppercase;letter-spacing:0;text-overflow:clip;padding:0 .3vw;color:#3A4048;height:7vh;line-height:1.15;white-space:normal;background:#F4F5F7;border-bottom:.3vh solid #8E949C}
.tvgrid th.cu,.tvgrid td.cu{width:24%;text-align:left} .tvgrid th.so,.tvgrid td.so{width:6.5%} .tvgrid th.due,.tvgrid td.due{width:11%} .tvgrid th.note,.tvgrid td.note{width:14%;text-align:left}
.tvgrid td.cu{white-space:normal} .tvgrid td.cu .tvcu{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.08}   /* long names on two lines, not cut off (Philip, 21 Oct) */
.tvgrid tbody tr{height:calc((100vh - 29vh) / var(--rows))}
.tvgrid td{font-size:2.5vh;text-align:center} .tvgrid td.cu{font-weight:700;font-size:2.6vh} .tvgrid td.so{font-family:var(--mono);font-size:2.4vh;font-weight:600}
.tvgrid td.c svg{width:3.6vh;height:3.6vh;vertical-align:middle} .tvgrid td.done{color:var(--tv-tick)} .tvgrid td.todo{color:var(--tv-star)} .tvgrid td.next{color:#fff;background:var(--tv-star)}
.tvgrid td.out span{display:inline-block;font-size:1.6vh;font-weight:800;letter-spacing:.06em;border:.25vh solid var(--tv-star);color:var(--tv-star);border-radius:.6vh;padding:.2vh .5vw} .tvgrid td.out.late span{border-color:var(--tv-red);color:#fff;background:var(--tv-red)}
.tvgrid td.due{font-weight:700} .tvgrid td.due.late{color:var(--tv-red)} .tvgrid td.due.soon{color:var(--tv-star)} .tvgrid td small{display:block;font-size:1.5vh;font-weight:600;line-height:1}
.tvgrid td.note{font-size:2vh;color:var(--tv-mute)} .tvgrid td.note.held,.tvgrid td.note.late{color:var(--tv-red);font-weight:700} .tvgrid td.note.ready{color:var(--tv-green);font-weight:700}
.tvgrid tr.late td.cu{box-shadow:inset .6vh 0 0 var(--tv-red)} .tvgrid tr.ready td{background:#EAF6EF} .tvgrid tr.ready td.next{background:var(--tv-star)} .tvgrid tr.held td:not(.note){opacity:.45}
.tvfoot{display:flex;align-items:center;gap:2.2vw;font-size:1.9vh;color:var(--tv-mute)} .tvfoot .k{display:inline-flex;align-items:center;gap:.4vw} .tvfoot svg{width:2.6vh;height:2.6vh}
.tvfoot .done{color:var(--tv-tick)} .tvfoot .todo{color:var(--tv-star)} .tvfoot .next svg{color:#fff;background:var(--tv-star);border-radius:.4vh;padding:.2vh} .tvfoot .out>span{font-size:1.3vh;font-weight:800;border:.2vh solid var(--tv-star);color:var(--tv-star);border-radius:.5vh;padding:0 .4vw}

/* ---------- personality (Philip, 21 Oct): small animated marks, the TV's mood line, the cheer when a job goes out ---------- */
.mi{width:1.4em;height:1.4em;flex:none;overflow:visible;vertical-align:middle}
.m-late{color:#C8321E} .m-late .hand{transform-origin:12px 13.5px;animation:mi-tick 1.2s steps(12) infinite} .m-late{animation:mi-shake 2.4s ease-in-out infinite}
.m-soon{color:#E8641E} .m-soon .glass{transform-origin:12px 12px;animation:mi-turn 4s ease-in-out infinite}
.m-ok{color:#2F5FD0} .m-ok .face{transform-origin:12px 20px;animation:mi-nod 6s ease-in-out infinite}
.m-ready{color:#1F7A45} .m-ready .lorry{animation:mi-rumble .35s ease-in-out infinite alternate}
.m-held{color:#8E949C} .m-held text{animation:mi-float 3s ease-in-out infinite} .m-held .z2{animation-delay:.5s} .m-held .z3{animation-delay:1s}
.m-rush{color:#C8321E} .m-rush .runner{animation:mi-run .5s ease-in-out infinite alternate} .m-rush .speed{animation:mi-blink .5s steps(2) infinite}
.m-clear{color:#1F7A45} .m-clear .steam{animation:mi-steam 2.5s ease-in-out infinite} .m-clear .s2{animation-delay:1.2s}
@keyframes mi-tick{to{transform:rotate(360deg)}}
@keyframes mi-shake{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-12deg)}88%{transform:rotate(12deg)}92%{transform:rotate(-8deg)}96%{transform:rotate(6deg)}}
@keyframes mi-turn{0%,75%{transform:rotate(0)}95%,100%{transform:rotate(180deg)}}
@keyframes mi-nod{0%,85%,100%{transform:rotate(0)}90%{transform:rotate(-7deg)}95%{transform:rotate(5deg)}}
@keyframes mi-rumble{from{transform:translateY(0)}to{transform:translateY(-.7px)}}
@keyframes mi-float{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-1.5px)}}

/* motion: short and quiet. Controls ease their colours and give a slight press; views fade in;
   drawer, scrim, toast and documents ease in and out (the exit needs display transitions, else it is instant) */
:root{--ease:cubic-bezier(.2,.8,.2,1);--ease-out:cubic-bezier(.16,1,.3,1)}
:where(.btn,.seg button,.pt,.tick,.pbtn,.st,.hcard,.citem,.hstep,.mk.kind,nav.tabs a,.badge,.kiosk .tile,.kiosk .step,.kiosk .back,input,select,textarea,table tbody td){
  transition:background-color .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease),box-shadow .16s var(--ease),opacity .16s var(--ease),transform .12s var(--ease)}
:where(.btn,.seg button,.pt,.tick,.pbtn,.st,.kiosk .tile,.kiosk .step,.kiosk .back):active:not(:disabled){transform:scale(.97)}
:where(.kiosk .tile,.kiosk .step,.pbtn):active:not(:disabled){transform:scale(.985)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes fade{from{opacity:0}}
.view:not([hidden]){animation:rise .26s var(--ease-out)}
#v-help .hq[open] p{animation:fade .2s var(--ease)}
.scrim{transition:opacity .22s var(--ease),display .22s allow-discrete}
.scrim[hidden]{opacity:0}
.drawer{transition:transform .3s var(--ease-out),display .3s allow-discrete;box-shadow:-12px 0 40px rgba(0,0,0,.18)}
.drawer[hidden]{transform:translateX(100%)}
.toast{transition:opacity .2s var(--ease),transform .28s var(--ease-out),display .28s allow-discrete}
.toast[hidden]{opacity:0;transform:translate(-50%,12px)}
.docwrap{transition:opacity .2s var(--ease),display .2s allow-discrete}
.docwrap[hidden]{opacity:0}
@starting-style{.scrim,.docwrap{opacity:0} .drawer{transform:translateX(100%)} .toast{opacity:0;transform:translate(-50%,12px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
