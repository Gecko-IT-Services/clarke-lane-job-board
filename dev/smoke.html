<!doctype html>
<html lang="en-GB">
<head>
<!-- Smoke test only: fake sign-in and made-up data. Built by dev/make-smoke.py. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Clarke Lane Job Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Tabbed work app: jobs table for the office, big tap targets for the shop floor, quotes and dispatch as short panels. Design from the agreed mockup. */
:root{
  --bg:#ECECEE; --surface:#FFFFFF; --field:#F4F4F5; --line:#D5D5D9; --ink:#111214; --muted:#64646A;
  --chrome:#111214; --chrome-ink:#FFFFFF; --chrome-mute:#A9A9AE; --steel:#3A3A3F; --steel-soft:#E4E4E7;
  --ok:#25744A; --ok-soft:#E0F1E7; --warn:#B45309; --warn-soft:#FDEED9; --bad:#B4321F; --bad-soft:#FBE4E0; --info:#2B5BD7; --info-soft:#E6EEFF;
  --paper:#FFFFFF; --paper-ink:#111214; --paper-line:#C9C9CE; --paper-mute:#5A5A60;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0C0D; --surface:#17171A; --field:#202024; --line:#323238; --ink:#EDEDEF; --muted:#9C9CA3;
  --chrome:#000000; --steel:#B4B4BA; --steel-soft:#2A2A2F;
  --ok:#5CC48A; --ok-soft:#173526; --warn:#F0A54B; --warn-soft:#3A2812; --bad:#F07B66; --bad-soft:#3D1C17; --info:#8FADFF; --info-soft:#1A2440; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0C0D; --surface:#17171A; --field:#202024; --line:#323238; --ink:#EDEDEF; --muted:#9C9CA3;
  --chrome:#000000; --steel:#B4B4BA; --steel-soft:#2A2A2F;
  --ok:#5CC48A; --ok-soft:#173526; --warn:#F0A54B; --warn-soft:#3A2812; --bad:#F07B66; --bad-soft:#3D1C17; --info:#8FADFF; --info-soft:#1A2440; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* one sticky bar: logo, tabs, who. Below 1100px the tabs drop to their own row. */
:root{--hdr:58px}
.top{background:var(--chrome);color:var(--chrome-ink);padding-inline:16px;padding-top:env(safe-area-inset-top,0px);position:sticky;top:0;z-index:20}
.top .in{max-width:1640px;margin:0 auto;display:flex;align-items:center;gap:0 18px;min-height:var(--hdr)}
.top .logo{height:32px;width:auto;display:block;flex:0 0 auto}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--chrome-mute);flex:none}
.who select{background:#1E1E22;color:#fff;border:1px solid #3A3A3F;border-radius:8px;padding:6px 10px;font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;align-self:stretch;min-width:0}
nav.tabs a{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--chrome-mute);text-decoration:none;padding:3px 12px 0;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:center}
nav.tabs a:hover{color:#E4E4E7;border-bottom-color:#3A3A3F}
nav.tabs a[aria-current="page"]{color:#fff;border-color:#fff}
@media (max-width:1100px){
  :root{--hdr:96px}
  .top .in{flex-wrap:wrap;min-height:0}
  .top .logo{margin-block:12px}
  nav.tabs{order:3;flex-basis:calc(100% + 32px);margin-inline:-16px;padding-inline:4px;border-top:1px solid #222226}
  nav.tabs a{padding:10px 12px 7px}
}
nav.tabs .badge{font-family:var(--body);font-size:12px;background:#2A2A2F;color:#fff;border-radius:999px;padding:1px 8px}
nav.tabs .badge.go{background:#25744A;margin-right:4px}

.wrap{max-width:1640px;margin:0 auto;padding-inline:16px;padding-block:18px 64px;display:flex;flex-direction:column;gap:18px}
.banner{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:10px;padding:10px 14px;font-size:14px;display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap}
.banner p{flex:1 1 420px;min-width:0}
.view{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;align-items:baseline;gap:8px 14px;flex-wrap:wrap}
.sec-h h2{font-size:30px}
.sec-h .sub{color:var(--muted);font-size:14px}
.sec-h .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:13px;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.sm{padding:4px 10px;font-size:13.5px}
.btn.link{border:0;background:none;padding:0;text-decoration:underline;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=search],input[type=date],input[type=number],select.f{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}

.seg{display:inline-flex;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:7px;padding:7px 14px;font-weight:700;display:flex;gap:8px;align-items:center;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.seg .c{font-size:12px;background:var(--line);border-radius:999px;padding:0 7px;color:var(--ink)}

.chip{display:inline-block;border-radius:5px;padding:1px 7px;font-size:12px;font-weight:700;background:var(--field);color:var(--muted);white-space:nowrap}
.chip.late{background:var(--bad-soft);color:var(--bad)} .chip.soon{background:var(--warn-soft);color:var(--warn)} .chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.dark{background:var(--ink);color:var(--bg)}

/* jobs table */
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
table.jobs{width:100%;border-collapse:collapse;font-size:14px}
table.jobs th{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.jobs td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.jobs tr:last-child td{border-bottom:0}
table.jobs tbody tr{cursor:pointer}
table.jobs tbody tr:hover td{background:var(--field)}
td.cust b{display:block;font-weight:600;line-height:1.2}
td.cust .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
td.so{font-family:var(--mono);font-size:13px;white-space:nowrap}
td.val{text-align:right;font-weight:700;white-space:nowrap}
td.p{text-align:center}
table.jobs td.cust{min-width:150px}
.tick{width:28px;height:28px;border-radius:7px;border:2px solid var(--muted);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;padding:0}
.tick.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.tick svg{width:18px;height:18px}
.pt{display:inline-flex;align-items:center;gap:6px;min-height:34px;border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 8px;margin:2px 4px 2px 0;background:var(--surface);color:var(--muted);font:600 13px var(--body);cursor:pointer}
.pt .bx{width:16px;height:16px;border-radius:4px;border:2px solid currentColor;display:inline-grid;place-items:center}
.pt svg{width:12px;height:12px}
.pt.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.pt:hover{border-color:var(--muted)}
.pt:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
td.ord{white-space:nowrap;width:1%}
td.ord .n{display:inline-block;min-width:22px;font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right;margin-right:6px}
td.ord .n.placed{color:var(--ink);font-weight:700}
td.ord .mv{display:inline-flex;gap:2px}
td.ord .mv .btn{padding:3px 5px;min-width:24px;line-height:1;font-size:12px}
.empty{color:var(--muted);padding:24px 16px;text-align:center}

/* shop floor */
.pbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pbtn{min-height:64px;border-radius:12px;border:2px solid var(--line);background:var(--field);text-align:left;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.pbtn b{font-family:var(--display);font-size:20px;line-height:1.05}
.pbtn span{font-size:12px;color:var(--muted)}
.pbtn.done{background:var(--ok-soft);border-color:var(--ok)}
.pbtn.done b{color:var(--ok)}

/* shop floor kiosk: one shared touchscreen; everything big, nothing hover-only */
body.kiosk-mode #app > header.top,body.kiosk-mode #app > nav.tabs,body.kiosk-mode #preview-bar{display:none}
.kiosk{display:flex;flex-direction:column;gap:22px}
.kiosk .kbar{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap}
.kiosk .kbar h2{font-family:var(--display);font-size:40px;letter-spacing:.04em;text-transform:uppercase;line-height:1.05}
.kiosk .kbar .sub{margin:2px 0 0;color:var(--muted);font-size:17px}
.kiosk .clock{margin-left:auto;text-align:right;color:var(--muted);font-size:15px}
.kiosk .clock b{display:block;color:var(--ink);font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kiosk .back{display:inline-flex;align-items:center;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:0 22px;min-height:64px;font:700 20px var(--body);cursor:pointer}
.kiosk .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.kiosk .tile{all:unset;box-sizing:border-box;cursor:pointer;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:18px;padding:22px 24px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.kiosk .tile .nm{font-family:var(--display);font-size:34px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;line-height:1.05}
.kiosk .tile .ct{display:block;color:var(--muted);font-size:18px}
.kiosk .tile .ct b{font-size:52px;font-weight:600;line-height:1;color:var(--ink);margin-right:8px;font-variant-numeric:tabular-nums}
.kiosk .tile.idle{opacity:.65}
.kiosk .tile.hot{border-color:var(--bad)}
.kiosk :is(.tile,.step,.back,.btn):focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.kiosk .tag{display:inline-block;border-radius:8px;padding:4px 12px;font-weight:700;font-size:16px;background:var(--field);color:var(--muted);margin:4px 8px 0 0}
.kiosk .tag.late{background:var(--bad-soft);color:var(--bad)}
.kiosk .tag.soon{background:var(--warn-soft);color:var(--warn)}
.kiosk .tag.ok{background:var(--ok-soft);color:var(--ok)}
.kiosk .kfoot{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.kiosk :is(.kfoot,.side) .btn{min-height:56px;font-size:17px;padding:0 20px;border-radius:12px}
.kiosk .kfoot em{font-style:normal;font-weight:500;margin-left:6px}
.kiosk .fq{display:flex;flex-direction:column;gap:14px}
.kiosk .fcard{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.kiosk .fcard.late{border-color:var(--bad)}
.kiosk .fcard.held{opacity:.6}
.kiosk .fcard.ready{border-color:var(--ok);background:var(--ok-soft)}
.kiosk .ftop{display:flex;align-items:flex-start;gap:16px}
.kiosk .pos{width:52px;height:52px;border-radius:14px;background:var(--field);display:grid;place-items:center;font-size:24px;font-weight:700;flex:none}
.kiosk .cu{font-size:25px;font-weight:700;line-height:1.2}
.kiosk .cu .so{font-family:var(--mono);color:var(--muted);font-size:16px;margin-left:10px;font-weight:500}
.kiosk .parts{display:flex;flex-wrap:wrap;gap:2px 18px;font-size:18px;color:var(--muted);margin-top:4px}
.kiosk .parts b{color:var(--ink);font-size:20px}
.kiosk .side{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.kiosk .route{display:flex;align-items:center;flex-wrap:wrap;row-gap:10px}
.kiosk .step{all:unset;box-sizing:border-box;cursor:pointer;min-width:170px;min-height:76px;border:2px solid var(--line);background:var(--field);color:var(--ink);border-radius:14px;padding:10px 16px;display:flex;align-items:center;gap:12px}
.kiosk .step .bx{width:34px;height:34px;border-radius:9px;border:3px solid var(--muted);display:grid;place-items:center;flex:none}
.kiosk .step .bx svg{width:22px;height:22px}
.kiosk .step b{display:block;font-family:var(--display);font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.kiosk .step small{display:block;font-size:14px;color:var(--muted)}
.kiosk .step.done{background:var(--ok-soft);border-color:transparent}
.kiosk .step.done .bx{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.kiosk .step.done small{color:var(--ok)}
.kiosk .step.here{border:3px solid var(--ink);background:var(--surface)}
.kiosk .step.here .bx{border-color:var(--ink)}
.kiosk .step:disabled{cursor:not-allowed}
.kiosk .arrow{width:34px;text-align:center;color:var(--muted);font-size:22px}
.kiosk .fstat{margin:0;font-size:18px;color:var(--muted)}
.kiosk .fstat b{color:var(--ink)}
.kiosk .allclear{margin:0;padding:24px;font-size:20px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:14px}
.kiosk .allclear.ok{color:var(--ok);font-weight:600}
@media (max-width:1000px){ .kiosk .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:640px){ .kiosk .tiles{grid-template-columns:minmax(0,1fr)} .kiosk .tile{min-height:110px} .kiosk .kbar h2{font-size:32px}
  .kiosk .ftop{flex-wrap:wrap} .kiosk .side{margin-left:0;align-items:flex-start;flex-direction:row;flex-wrap:wrap;width:100%}
  .kiosk .arrow{display:none} .kiosk .route{gap:10px} .kiosk .step{flex:1 1 100%} }

/* quotes */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.qcard .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.qcard .h .mono{font-size:13px;color:var(--muted)}
.qcard .amt{font-family:var(--display);font-size:24px;font-weight:700}
.qcard .cust{font-weight:700;font-size:16px}
.qcard ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.convert{background:var(--field);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.convert .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.convert label.fl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.pchecks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pchecks label{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;font-weight:600}
.pchecks input{width:18px;height:18px;accent-color:var(--ink)}

/* dispatch */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:22px}
.lines{width:100%;border-collapse:collapse;font-size:14px}
.lines th{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
.lines th:first-child,.lines td:first-child{text-align:left}
.lines td{padding:8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.lines input{width:90px;text-align:right}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600}
.callrow{display:flex;gap:18px;flex-wrap:wrap}
.call{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);min-width:52px}
.call i{width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;color:var(--ink)}
.call.done i{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.call.late i{border-color:var(--bad);color:var(--bad)}
.call b{color:var(--ink);font-size:12.5px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:41;overflow-y:auto;padding-inline:18px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--line)}
.drawer .dh{display:flex;gap:10px;align-items:flex-start}
.drawer .dh h2{font-size:28px;line-height:1.05}
.drawer .dh .x{margin-left:auto}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.fact .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.fact .v{font-weight:700}
.log{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin:0;padding:0;list-style:none}
.log b{color:var(--ink);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* documents: printed paper, deliberately light in both themes */
.docwrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);overflow-y:auto;padding-inline:16px;padding-block:calc(20px + env(safe-area-inset-top,0px)) 40px}
.sheetedit{max-width:794px;margin:0 auto 12px}
.docbar{max-width:794px;margin:0 auto 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:#fff;font-size:13.5px}
.docbar .btn{color:var(--ink)} .docbar .btn.pri{color:var(--bg)}
.docbar .btn:first-of-type{margin-left:auto}
.paper{max-width:794px;margin:0 auto;background:var(--paper);color:var(--paper-ink);padding:44px 48px;border-radius:4px;font-size:13.5px;box-shadow:0 10px 40px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:22px}
.paper .ph{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start}
.paper .ph svg{height:46px;width:auto}
.paper .ph svg path{fill:var(--paper-ink)}
.paper .ph svg path+path{fill:var(--paper-mute)}
.paper h1{font-size:30px;text-align:right;text-transform:uppercase;letter-spacing:.04em}
.paper .dno{text-align:right;font-family:var(--mono);font-size:13px}
.paper .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.paper .k{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--paper-mute);font-weight:600}
.paper .kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px}
.paper table{width:100%;border-collapse:collapse}
.paper th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--paper-mute);text-align:right;border-bottom:2px solid var(--paper-ink);padding:6px 6px}
.paper td{border-bottom:1px solid var(--paper-line);padding:8px 6px;text-align:right;font-variant-numeric:tabular-nums}
.paper th:first-child,.paper td:first-child{text-align:left}
.paper .tot{margin-left:auto;min-width:240px;display:grid;grid-template-columns:1fr auto;gap:4px 20px;font-variant-numeric:tabular-nums}
.paper .tot .g{font-weight:700;font-size:16px;border-top:2px solid var(--paper-ink);padding-top:4px}

#v-help .hmap{position:relative;height:200px;border-radius:10px;background:linear-gradient(135deg,#dfe9d6,#e8efe0 40%,#d5e3ee);overflow:hidden}
#v-help .hpin{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--k);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transform:translate(-50%,-50%)}
#v-help .hpop{position:absolute;left:50%;top:58%;background:#fff;color:#111;border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 3px 12px rgba(0,0,0,.25);max-width:280px}
#v-help .htabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:6px 14px;margin:0 0 14px;max-width:980px}
#v-help .htabs div{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
#v-help .htabs b{font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:16px}
#v-help .htabs span{font-size:12.5px;color:var(--muted)}
#v-help .hq{border-top:1px solid var(--line);padding:10px 0}
#v-help .hq summary{font-weight:700;cursor:pointer}
#v-help .hq p{margin:6px 0 0;color:var(--muted)}
@media (max-width:820px){ #v-help .harrow{display:none} }
@media print{ #v-help .hframe{break-inside:avoid} }
/* motion: short and quiet. Controls ease their colours and give a slight press; views fade in;
   drawer, scrim, toast and documents ease in and out (the exit needs display transitions, else it is instant) */
:root{--ease:cubic-bezier(.2,.8,.2,1);--ease-out:cubic-bezier(.16,1,.3,1)}
:where(.btn,.seg button,.pt,.tick,.pbtn,.st,.hcard,.citem,.hstep,.mk.kind,nav.tabs a,.badge,.kiosk .tile,.kiosk .step,.kiosk .back,input,select,textarea,table tbody td){
  transition:background-color .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease),box-shadow .16s var(--ease),opacity .16s var(--ease),transform .12s var(--ease)}
:where(.btn,.seg button,.pt,.tick,.pbtn,.st,.kiosk .tile,.kiosk .step,.kiosk .back):active:not(:disabled){transform:scale(.97)}
:where(.kiosk .tile,.kiosk .step,.pbtn):active:not(:disabled){transform:scale(.985)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes fade{from{opacity:0}}
.view:not([hidden]){animation:rise .26s var(--ease-out)}
#v-help .hq[open] p{animation:fade .2s var(--ease)}
.scrim{transition:opacity .22s var(--ease),display .22s allow-discrete}
.scrim[hidden]{opacity:0}
.drawer{transition:transform .3s var(--ease-out),display .3s allow-discrete;box-shadow:-12px 0 40px rgba(0,0,0,.18)}
.drawer[hidden]{transform:translateX(100%)}
.toast{transition:opacity .2s var(--ease),transform .28s var(--ease-out),display .28s allow-discrete}
.toast[hidden]{opacity:0;transform:translate(-50%,12px)}
.docwrap{transition:opacity .2s var(--ease),display .2s allow-discrete}
.docwrap[hidden]{opacity:0}
@starting-style{.scrim,.docwrap{opacity:0} .drawer{transform:translateX(100%)} .toast{opacity:0;transform:translate(-50%,12px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

html,body{margin:0}
[hidden]{display:none!important}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.warnbox{border-color:var(--bad)}
.njlines input[type=number]{width:100px}
.njlines td:first-child{min-width:220px}
.newjob{border-color:var(--ink)}
.rowerr td{background:var(--bad-soft)}
.note.bad{color:var(--bad)}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-block:8px}
details.splitter>summary{list-style:none;display:inline-flex}
details.splitter>summary::-webkit-details-marker{display:none}
details.splitter[open]{flex-basis:100%;background:var(--field);border-radius:10px;padding:10px}
.njlines input[type=text]{width:100%}
.njlines input[type=date]{width:150px}
.newjob textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:inherit;color:inherit;resize:vertical}
tr.muted td{color:var(--muted)}
.bad{color:var(--bad)}
@media (max-width:560px){.row3{grid-template-columns:minmax(0,1fr)}}
table.inbox td{vertical-align:middle}
table.inbox th:nth-child(-n+3),table.inbox td:nth-child(-n+3){text-align:left}
table.inbox .acts{white-space:nowrap;display:flex;gap:6px;justify-content:flex-end;align-items:center}
.paper.pdf{background:#fff;color:#111214}
.cdates{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.btn.ghost{background:transparent;border-color:#3A3A3F;color:#fff}
.who{color:#C8C8CC;font-weight:600;gap:10px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 14px;font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toast.bad{background:var(--bad);color:#fff}
.toast.bad button{color:#fff}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
div.fl{font-size:12.5px;font-weight:600;color:var(--muted)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.qcard.wide{grid-column:1/-1}
form.inv{display:flex;gap:6px;justify-content:flex-end}
form.inv input{width:110px}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-inline:16px;background:var(--chrome)}
.gate .box{background:var(--surface);border-radius:16px;padding:28px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px}
.gate .box svg{height:40px;width:auto}
.gate .box svg path{fill:var(--ink)} .gate .box svg path+path{fill:var(--muted)}
@media (max-width:560px){.row2{grid-template-columns:minmax(0,1fr)}}
@media print{
  body.doc-open > *:not(#doc){display:none!important}
  body.doc-open{background:#fff}
  #doc{position:static;background:none;padding:0;overflow:visible}
  .docbar,.sheetedit{display:none!important}
  .paper{box-shadow:none;max-width:none;padding:0;border-radius:0}
  @page{size:A4;margin:14mm}
}
